databases:
  - name: dailydose-db
    databaseName: dailydose_db
    user: dailydose_app
    plan: free
    region: singapore
    ipAllowList: []

services:
  # 1. Backend FastAPI Service
  - type: web
    name: dailydose-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dailydose-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Next.js Service
  - type: web
    name: dailydose-frontend
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dailydose-backend
          property: host
